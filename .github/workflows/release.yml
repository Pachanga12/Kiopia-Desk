name: Release

# Compila el instalador de Windows y lo publica como release de GitHub al subir
# un tag de versión (p. ej. v2.1.1), o a mano desde la pestaña Actions.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag de la versión a publicar (ej. v2.1.1)"
        required: true

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint y tests
        run: |
          npm run lint
          npm test

      # Sin certificado de firma de código (ver README → Seguridad).
      # Portable (dist/portable) + instalador que la lleva dentro (scripts/build.js).
      - name: Build installer
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Kiopia Desk ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.exe
            dist/portable/*.exe
          generate_release_notes: true
